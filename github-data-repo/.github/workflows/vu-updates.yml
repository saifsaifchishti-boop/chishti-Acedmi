name: VU updates
on:
  schedule: [{cron: '0 * * * *'}]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: node scripts/vu-watch.mjs
      - run: |
          git config user.name "vu-watch"; git config user.email "bot@users.noreply.github.com"
          git add updates.json && (git commit -m "VU updates" && git push) || echo "no changes"
